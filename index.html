<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Explore — Wanderstay</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

      <input type="search" name="q" placeholder="Where to?" aria-label="Search stays" />
      <button class="go" type="submit" aria-label="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>

    <div class="cats" role="tablist">

      <a class="cat" href="listings.html"><span class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>Trending</a>
    </div>

    <div class="section">
      <div class="section-head"><span class="heading-md">Popular destinations</span></div>
    </div>
    <div class="dest-row">
      <a class="dest" href="property.html"><img src="https://picsum.photos/seed/d1/128/128" alt="Bali" /><span>Bali</span></a>
      <a class="dest" href="property.html"><img src="https://picsum.photos/seed/d2/128/128" alt="Kyoto" /><span>Kyoto</span></a>

      <a class="dest" href="property.html"><img src="https://picsum.photos/seed/d4/128/128" alt="Lake Como" /><span>Lake Como</span></a>
      <a class="dest" href="property.html"><img src="https://picsum.photos/seed/d5/128/128" alt="Tulum" /><span>Tulum</span></a>
    </div>

    <div class="section">
      <div class="section-head"><span class="heading-md">Featured stays</span></div>
    </div>
    <a class="feature-card" href="property.html">
      <div class="media">
        <img src="https://picsum.photos/seed/stay1/720/450" alt="Featured stay" />
        <button class="icon-btn fav" aria-label="Save"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>

        <div class="row">
          <span class="title">Lakeside retreat</span>

        <div class="meta">Lake Como, Italy · 6,100 km away</div>
        <div class="price"><b>$214</b> night</div>
      </div>

    <nav class="nav">
      <a class="tab active" href="index.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Explore</a>
